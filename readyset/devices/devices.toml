# devices.toml — the CATALOGUE of hardware this program can draw.
#
# WHY THIS IS DATA AND NOT CODE. Two Yamaha slab pianos (P-225, P-125) used to be
# hard-coded in a module that is otherwise generic. They are neither engine nor one
# user's config: they are a catalogue. As data, three things come right at once — the
# engine goes back to being generic, one person's gear leaves the source, and somebody
# else can add their own without writing any Python.
#
# WHY DRAWINGS AND NOT PHOTOGRAPHS. Deliberate, and it is the reason this file exists
# at all rather than a folder of images:
#   · no network, nothing to download, nothing to cache and nothing to repair the day a
#     URL dies. The dashboard stays served entirely locally, which is its whole point on
#     a stage network with no Internet;
#   · no rights question over a catalogue picture;
#   · at 22 px in a table row a photo becomes a grey smudge. A sharp silhouette stays
#     readable — at that size it is the SILHOUETTE you recognise, not the product.
#
# So the success criterion is: recognisable at a glance, at 22 px, on a dark background.
# Each drawing keeps the one line that really tells the object apart — the two aerials
# and the yellow case of the travel router, the black and white keys of the piano, the
# lamp's beam — and drops everything else.
#
# TO ADD YOUR OWN DEVICE: append a [[device]] with either `template` (and its
# parameters) or a literal `svg`, then a [[binding]] that ties it to a check key.

# Aligned with the dashboard's palette (surfaces/web/page.html) so the drawings do not
# clash with the rest of the page.
[palette]
line   = "#e7ebf2"   # main stroke
muted  = "#8a93a3"   # secondary stroke
accent = "#4a9eff"   # blue accent
warm   = "#f4b942"   # yellow (travel router, light)


# --- devices ---------------------------------------------------------------------
# `template` = a generic drawing this file fills in. `svg` = a literal drawing.
# Colours are written {line} {muted} {accent} {warm} and resolved from [palette].

# The two slab pianos are near-identical — telling them apart by silhouette would be a
# draughtsman's lie. So it is the NUMBER that separates them, plus an accent colour: at
# 22 px you will not read the digits, but you will see there are TWO accepted keyboards,
# and the tooltip spells it out. Two honestly similar thumbnails beat one invented detail.
[[device]]
id = "p225"
name = "Slab piano, first accepted model"
template = "slab-piano"
badge = "225"
accent = "accent"

[[device]]
id = "p125"
name = "Slab piano, second accepted model"
template = "slab-piano"
badge = "125"
accent = "muted"

# A pocket travel router: a small YELLOW box with two aerials. It is the only yellow
# object in the flight case — the colour alone identifies it from across the room, which
# is exactly what a 22 px thumbnail is asked to do.
[[device]]
id = "router"
name = "Stage travel router"
svg = """
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 32">
  <path d="M11 13V5.5M37 13V5.5" stroke="{muted}" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="11" cy="4" r="1.6" fill="{muted}"/><circle cx="37" cy="4" r="1.6" fill="{muted}"/>
  <rect x="6" y="12.5" width="36" height="15" rx="3" fill="{warm}" stroke="#c8901f" stroke-width="1.2"/>
  <rect x="9.5" y="16" width="29" height="4.5" rx="1.2" fill="#1b1f28" opacity=".35"/>
  <circle cx="12" cy="24" r="1.35" fill="#1b1f28"/>
  <circle cx="17" cy="24" r="1.35" fill="#1b1f28" opacity=".45"/>
</svg>"""

# Stage lamp. The beam is the half that matters: a lamp that is off and a lamp that is on
# is the whole question the check asks.
[[device]]
id = "lamp"
name = "Stage lamp"
svg = """
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 32">
  <path d="M24 20 L13 30 h22 Z" fill="{warm}" opacity=".22"/>
  <rect x="15" y="5" width="18" height="14" rx="2.5" fill="#1b1f28" stroke="{muted}" stroke-width="1.4"/>
  <ellipse cx="24" cy="19" rx="9" ry="2.6" fill="{warm}"/>
  <path d="M24 3.5v-2M15.5 5.5 14 4M32.5 5.5 34 4" stroke="{muted}" stroke-width="1.4" stroke-linecap="round"/>
  <rect x="21" y="26" width="6" height="4" rx="1" fill="{muted}"/>
</svg>"""

# Phone. The pill-shaped cutout is the one detail that dates the model at a glance —
# so it is the one detail drawn.
[[device]]
id = "phone"
name = "Phone"
svg = """
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 32">
  <rect x="17" y="2" width="14" height="28" rx="3.4" fill="#1b1f28" stroke="{line}" stroke-width="1.5"/>
  <rect x="18.8" y="4.4" width="10.4" height="23.2" rx="2" fill="{accent}" opacity=".18"/>
  <rect x="21.4" y="5.6" width="5.2" height="1.9" rx=".95" fill="{line}"/>
</svg>"""


# --- bindings: which check shows which thumbnail ----------------------------------
# Read TOP TO BOTTOM, first match wins — so the specific comes before the general.
# `key` is exact, `key_prefix` matches the start, `label_contains` narrows further.
# `apps` names a macOS app whose REAL icon is used; `devices` names drawings above.
#
# A check can carry SEVERAL, and that is not decoration: "Bome Network ↔ phone" is a link
# between two devices, and showing both says at a glance where to go looking.

[[binding]]
key = "kbd:keyboard"
devices = ["p225", "p125"]     # the two accepted models

[[binding]]
key = "net:stage"
devices = ["router"]

[[binding]]
key = "lamp:all"
devices = ["lamp"]

[[binding]]
key = "net:iphone"
apps = ["Bome Network"]
devices = ["phone"]

[[binding]]
key = "pow:iphone"
devices = ["phone"]

[[binding]]
key_prefix = "usb:"
apps = ["Elgato Stream Deck"]

# Before the generic "audio:" rule below — otherwise the DAW's own output check would
# get a piano instead of the DAW's icon.
[[binding]]
key = "audio:live"
apps = ["Ableton"]

[[binding]]
key_prefix = "midi:Ableton"
apps = ["Ableton"]

[[binding]]
key_prefix = "audio:"
label_contains = "P-Series"
devices = ["p225"]
