# rig.toml — copy to `rig.toml` (git-ignored) and set YOUR rig here. Anything omitted
# falls back to the generic defaults in riglib/config.py. Nothing below is personal —
# these are placeholder examples; replace with your paths / IPs / device names / MACs.

[set]
ableton_app = "/Applications/Ableton Live 12 Suite.app"
project     = "/path/to/your/Gig Set.als"    # the .als preflight opens
open_after_launch = true

[launch]
apps = [
  "/Applications/Bome MIDI Translator Pro.app",
  "/Applications/Bome Network.app",
  "/Applications/Elgato Stream Deck.app",
  # "/Applications/Stage Traxx 4.app",
  # "/Applications/Amphetamine.app",
]
settle_seconds = 2
amphetamine_session = true   # start an anti-sleep session during bring-up

[server]
# Interface d'écoute du dashboard.
#   "127.0.0.1" (défaut) → cette machine seulement.
#   "0.0.0.0"            → ouvert au RÉSEAU LOCAL : la page est consultable depuis le
#                          téléphone, et surtout le téléphone peut publier son propre
#                          état (POST /api/phone, voir plus bas).
# Il n'y a AUCUNE authentification, et le dashboard sait lancer et fermer des apps
# (/api/fix, /api/quit-apps, /api/preflight). À n'ouvrir que sur un réseau de confiance.
host = "127.0.0.1"
# Âge au-delà duquel le dernier rapport du téléphone n'est plus cru (secondes).
# Âge au-delà duquel le dernier relevé n'est plus cru et la ligne revient à
# « à confirmer ». Une heure, pas cinq minutes : une automatisation iOS ne publie qu'au
# BRANCHEMENT, donc « branché il y a 20 min » reste vrai. Si le Mac interroge lui-même
# (idevice_poll_seconds ci-dessous), descendre juste au-dessus de cette cadence : le
# silence devient alors un signal en soi.
phone_stale_seconds = 3600

# --- la pente de la batterie, qui sert de DÉMENTI ------------------------------------
# « En charge » est un fait daté du branchement, que plus rien ne revérifie : un câble
# sorti, une multiprise éteinte, un chargeur mort ne le changent pas. La batterie, si.
# Un seul pour cent PERDU suffit à conclure — une batterie qui charge ne recule pas —
# d'où un écart minimal court, moins long qu'un soundcheck.
trend_window_seconds = 10800       # on ne regarde pas au-delà de 3 h en arrière
trend_min_span_seconds = 180       # écart minimal pour parler de baisse
# ESTIMER l'autonomie demande bien plus de recul : à 1 % près sur 3 min, la pente vaut
# ±20 %/h. Sous cet écart on dit « elle descend » sans oser chiffrer combien de temps.
trend_autonomy_span_seconds = 1800
autonomy_min_hours = 3.0           # en dessous, il ne passera pas la soirée → erreur

# --- deux sources possibles, un seul historique --------------------------------------
# 1) LE TÉLÉPHONE PUBLIE (aucune installation) :
#      curl -X POST http://<mac>.local:8765/api/phone \
#           -H 'Content-Type: application/json' \
#           -d '{"charging": true, "battery": 87}'
#    Côté iPhone : Raccourcis → « Niveau de la batterie » + « État de charge » →
#    « Obtenir le contenu de l'URL » (POST, JSON), déclenché par une automatisation
#    « quand je branche / débranche ». Simple, mais ce n'est pas un battement : la pente
#    a besoin de plusieurs points.
# 2) LE MAC INTERROGE (battement régulier, rien à installer sur le téléphone) — via
#    libimobiledevice : `brew install libimobiledevice`, puis l'iPhone branché UNE fois
#    en USB, déverrouillé, « Se fier », et Finder → « Afficher cet iPhone lorsqu'il est
#    en Wi-Fi ». Sans appairage, la lecture échoue en silence et rien ne change.
idevice_poll_seconds = 60          # 0 = ne pas interroger
idevice_bin = ""                   # vide = PATH, puis les emplacements Homebrew

[checks]
apps = { Ableton = "Ableton Live.*/MacOS/Live", "Stream Deck" = "Elgato Stream Deck.app/Contents/MacOS/Stream Deck", "Bome MIDI Translator" = "MIDITranslatorPro", "Bome Network" = "Bome Network.app/Contents/MacOS/MT Player" }
midi_required = ["Ableton Loopback"]      # MIDI input ports that MUST exist
breath_port   = "Breath Controller"       # breath controller's MIDI input name
audio_interface = "USB Audio"             # your interface's CoreAudio name
default_output_match = "MacBook"          # macOS default output should be the Mac
bome_network_port = 37000                 # Bome Network port; ESTABLISHED = remote connected
iphone_host = ""                          # require a specific peer IP, or empty = any
# Network (your stage + studio):
stage_network = "192.168.1"               # subnet the Mac must be on
modem_host    = "192.168.1.1"             # stage router/modem to ping
studio_router = "192.168.1.1"             # reachable → "auto" mode = studio
lamp_severity = "warn"

# Stream Decks. Short form (product-name substring per deck):
#   streamdecks = { XL = "Stream Deck XL", Plus = "Stream Deck +" }
# Long form (preferred) — matches the USB serial FIRST, product name second, and passes
# if either hits. The name ioreg exposes isn't stable across firmwares (the Plus shows up
# as "Stream Deck +" on some, "Stream Deck Plus" on others) whereas the serial never
# changes. Read it off the Stream Deck app's own device id in any profile manifest:
# "UUID": "@(1)[vid/pid/SERIAL]".
# [[checks.streamdecks]]
# name    = "XL"
# serial  = "CL13L2A01061"
# product = ["Stream Deck XL"]

# Stage lamps (Tuya/WLED) — found by MAC via ARP, then pinged. Add one block per lamp.
# [[checks.lamps]]
# name = "L1"
# mac  = "aa:bb:cc:dd:ee:ff"

# VPN. An active tunnel rewrites the machine's routing, so the Mac can stop seeing the
# iPhone, the stage modem and the lamps — hence a check, and a one-click cut.
[checks.vpn]
# VPNs you accept (substring of the service name) — they never turn the check red.
ignore = []
# Per-VPN override for HOW to cut it (substring → shell command). With no entry, the
# generic method applies: disable the network service — the only thing that holds
# against an on-demand profile (see riglib/vpn.py).
[checks.vpn.off_cmds]

# Open apps the rig doesn't need — one line each, **warning on stage** (a notification
# landing in front of the set, CPU taken from the DAW, an updater waking up mid-song) and
# **plain info in the studio**. Per-mode via `unexpected_apps_severity`; never fail — an
# extra app makes the rig fragile, it doesn't stop it from playing. The dashboard lists
# them with their icons and asks for confirmation before quitting anything; from a
# terminal: `rig apps`, then `rig apps --close`.
#
# Only apps with a real on-screen presence are considered: menu-bar agents and background
# apps never show up here — they can't clutter the screen.
[checks.unexpected_apps]
# Never offered for closing (substring of the name or path). Finder is here by default:
# macOS relaunches it anyway.
allow = ["Finder"]

# --- windows: everything RUNS, only the DAW is SEEN ----------------------------------
# The rig apps (MIDI router, deck software, backing-track player) must run — they carry
# the routing, the buttons and the tracks — but their windows are noise on a stage
# screen. Policies: "hide" (⌘H — gone from the screen, still running), "minimize"
# (windows to the Dock), "keep" (left alone).
[windows]
default = "hide"
launch_hidden = true      # `open -g -j`: apps come up already hidden, nothing flashes
after_preflight = true    # a bring-up ends by tidying the screen

[windows.apps]
# Key = substring of the .app name. The DAW stays visible: the set IS the stage screen.
"Ableton" = "keep"

[mode]
default = "auto"    # boots live; flips to studio when studio_router answers

[modes.live]
keyboard_ok   = ["Piano"]             # your main keyboard's MIDI port (green if present)
keyboard_warn = []                    # fallback keyboards (yellow if only these)
live_output   = ["Piano"]            # Ableton must output here on stage
# Anti-veille : sur scène, un Mac qui s'endort arrête le set — donc "fail", au même
# titre qu'un clavier débranché. Niveaux : fail | warn | info | off ("off" = la ligne
# n'apparaît pas). Remplace l'ancien booléen `require_amphetamine`, qui ne pouvait que
# FAIRE DISPARAÎTRE la ligne — un rig sans anti-veille ressemblait à un rig sans problème.
amphetamine_severity = "fail"
breath_severity = "fail"
interface_severity = "fail"
mac_power_severity = "fail"
iphone_power_severity = "fail"
# Le soundcheck (gestes réellement joués) compte comme un check à part entière :
# un rig jamais joué n'est pas un rig vérifié. "off" pour ne pas l'exiger.
soundcheck_severity = "fail"
network_severity = "fail"   # covers BOTH stage_network and modem_host — same question
# (Mac plugged but battery still draining = always FAIL, both modes.)

[modes.studio]
keyboard_ok   = ["Piano"]
keyboard_warn = ["microKey"]
live_output   = ["MacBook", "USB Audio"]
amphetamine_severity = "off"   # au bureau le Mac peut dormir : la question n'a pas d'objet
breath_severity = "warn"
interface_severity = "warn"
mac_power_severity = "warn"
iphone_power_severity = "warn"
network_severity = "warn"   # the stage network is elsewhere — at the desk it *can't*
                            # answer, so its absence is information, not a defect

[monitor]
interval    = 5
audio_every = 6
alerts      = ["macos", "push", "streamdeck"]
recovery_alerts = true

[alerts.push]
# ntfy.sh: pick a PRIVATE, unguessable topic and subscribe to it in the ntfy app.
server   = "https://ntfy.sh"
topic    = ""            # e.g. "my-rig-9d3f2a" — leave empty to disable push
priority = "high"
insecure = false         # set true only if your LAN does SSL interception (self-signed)

[alerts.streamdeck]
# Emits a note on a dead-end IAC port. Create it once: Audio MIDI Setup → IAC Driver
# → "+" → rename "rig-alert". Map a Stream Deck key to MIDI feedback (note 60, ch 15).
port    = "rig-alert"
channel = 15
note    = 60

# ---------------------------------------------------------------------------------
# Erreurs LIÉES — ce qui tombe AVEC quoi (riglib/cascade.py).
#
# À ne pas confondre avec [diagram] : celui-là dessine le flux MIDI et audio, celui-ci
# décrit les DÉPENDANCES — le plus souvent l'alimentation. Les deux ne se recouvrent pas :
# un clavier peut envoyer son MIDI à Ableton tout en tirant son courant d'un hub, et c'est
# le courant qui décide de qui tombe avec qui.
#
# Sans ces blocs, un hub débranché produit quatre pannes également urgentes, dont trois
# sont des symptômes ; l'écran d'alarme les aligne et laisse chercher laquelle réparer.
# Avec eux, la CAUSE passe en tête et les autres se rangent dessous, grisées, chacune
# disant en une ligne pourquoi elle est tombée.
#
#   on    = la clé du check qui, en tombant, entraîne les autres
#   keys  = les clés qui en dépendent (elles ne sont « liées » que si `on` est LUI AUSSI
#           en panne — un appareil débranché pendant que sa source va bien reste une
#           panne à part entière, et le cacher serait pire que ne rien relier)
#   why   = le lien en toutes lettres ; c'est lui qui dit où aller regarder
#   modes = facultatif — le lien ne vaut que dans ces modes (au bureau, la moitié du rig
#           n'est simplement pas branchée, et un lien qui ne vaut pas ce soir ment)
#
# Les chaînes se remontent : si A alimente B et B alimente C, la cause affichée est A.
#
# [[depends]]
# on    = "usb:Plus"
# keys  = ["usb:XL", "kbd:keyboard"]
# why   = "alimenté par le Stream Deck Plus"
# modes = ["live"]
