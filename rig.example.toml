# rig.toml — copy this to `rig.toml` (git-ignored) and adapt to YOUR rig. Everything
# omitted falls back to the defaults in riglib/config.py.
#
# This is a COMPLETE, realistic example (a funk-band keyboard rig) so you can see every
# feature wired up. It is anonymised — no real paths, IPs, MACs or ntfy topic. Replace
# the placeholders with your own.

[set]
ableton_app = "/Applications/Ableton Live 12 Suite.app"
project     = "/Users/you/Music/Gig Sets/Funk Set.als"   # the .als preflight opens
open_after_launch = true

[launch]
# Launch order (Bome owns the MIDI plumbing, so it comes up before the set).
apps = [
  "/Applications/Bome MIDI Translator Pro.app",
  "/Applications/Bome Network.app",
  "/Applications/Elgato Stream Deck.app",
  "/Applications/Stage Traxx 4.app",
  "/Applications/Amphetamine.app",
]
settle_seconds = 2
amphetamine_session = true   # start an anti-sleep session during bring-up

[checks]
# label -> regex matched against the full process command line (pgrep -f).
apps = { Ableton = "Ableton Live.*/MacOS/Live", "Stream Deck" = "Elgato Stream Deck.app/Contents/MacOS/Stream Deck", "Bome MIDI Translator" = "MIDITranslatorPro", "Bome Network" = "Bome Network.app/Contents/MacOS/MT Player", "Stage Traxx" = "Stage Traxx" }
midi_required = ["Ableton Loopback"]       # MIDI input ports that MUST exist
breath_port   = "Breath Controller"        # breath controller's MIDI input name
audio_interface = "RME Fireface UCX"       # your audio interface's CoreAudio name
default_output_match = "MacBook"           # macOS default output should be the Mac
stage_network = "192.168.1"                # subnet the Mac must be on
studio_router = "192.168.1.1"              # reachable → "auto" mode = studio
# USB devices that must be plugged: {label = product-name substring} (via ioreg).
usb_devices = { "Stream Deck XL" = "Stream Deck XL", "Stream Deck Plus" = "Stream Deck Plus" }

# Keep-awake app holding a power assertion. `owner` = the name in `pmset -g assertions`.
# Checked only in modes with require_awake = true.
[checks.keepawake]
process = "Amphetamine.app/Contents/MacOS/Amphetamine"
owner   = "Amphetamine"
label   = "Amphetamine (anti-veille)"
icon    = "☕"

# A value read from an app's log, compared to the mode's `live_output`. Here: the audio
# output device Ableton logs on startup. `pattern` needs one capture group.
[checks.output_probe]
log_glob = "~/Library/Preferences/Ableton/Live*/Log.txt"
pattern  = "Audio In Out: Output Device: (.+)"
label    = "Ableton output"
icon     = "🎚️"

# Remote links = an ESTABLISHED TCP connection on a port. Here: an iPhone (running a
# network-MIDI app) connecting to Bome Network's port.
[[checks.links]]
name = "iPhone ↔ Bome"
port = 37000
icon = "📱"

# Hosts that must respond — a stage modem (by IP, blocking) and two smart lamps (by MAC,
# resolved via ARP, warn). The engine just pings; the name + icon carry the meaning.
[[checks.hosts]]
name = "Stage modem"
ip   = "192.168.1.1"
severity = "fail"
icon = "📡"
[[checks.hosts]]
name = "Lamp L1"
mac  = "aa:bb:cc:00:00:01"
icon = "💡"
[[checks.hosts]]
name = "Lamp L2"
mac  = "aa:bb:cc:00:00:02"
icon = "💡"

[mode]
default = "auto"    # boots live; flips to studio when studio_router answers

[modes.live]
keyboard_ok   = ["P-225"]              # main stage keyboard (green if present)
keyboard_warn = []                     # fallback keyboards (yellow if only these)
live_output   = ["P-225"]              # Ableton must output here on stage
require_awake = true
breath_severity = "fail"
interface_severity = "fail"
mac_power_severity = "fail"
iphone_power_severity = "fail"
# (Mac plugged but battery still draining = always FAIL, both modes.)

[modes.studio]
keyboard_ok   = ["Digital Piano", "P-225"]   # preferred desk keyboard → green
keyboard_warn = ["microKey"]                 # a mini-keyboard alone → warning
live_output   = ["MacBook", "RME Fireface UCX"]
require_awake = false
breath_severity = "warn"
interface_severity = "warn"
mac_power_severity = "warn"
iphone_power_severity = "warn"

[monitor]
interval    = 5
audio_every = 6
alerts      = ["macos", "push", "streamdeck"]
recovery_alerts = true

[alerts.push]
# ntfy.sh: pick a PRIVATE, unguessable topic and subscribe to it in the ntfy app.
server   = "https://ntfy.sh"
topic    = ""            # e.g. "my-rig-9d3f2a" — leave empty to disable push
priority = "high"
insecure = false         # true only if your LAN does SSL interception (self-signed cert)

[alerts.streamdeck]
# Emits a note on a dead-end IAC port. Create it once: Audio MIDI Setup → IAC Driver
# → "+" → rename "rig-alert". Map a Stream Deck key to MIDI feedback (note 60, ch 15).
port    = "rig-alert"
channel = 15
note    = 60

# Signal-flow diagram. Each node references check keys; its colour = the worst status
# among them. Positions are on a 764×300 canvas. Empty nodes list → diagram hidden.
[diagram]
edges = [["iphone","bome"],["streamdeck","bome"],["keyboard","daw"],["bome","daw"],["traxx","daw"],["daw","out"]]
nodes = [
  {id="iphone",    label="iPhone",       icon="📱", x=88,  y=56,  keys=["link:iPhone ↔ Bome"]},
  {id="streamdeck",label="Stream Deck",  icon="🎛️", x=88,  y=150, keys=["usb:Stream Deck XL","usb:Stream Deck Plus","app:Stream Deck"]},
  {id="keyboard",  label="Keyboard",     icon="🎹", x=88,  y=244, keys=["kbd:keyboard"]},
  {id="bome",      label="Bome",         icon="🔀", x=312, y=103, keys=["app:Bome MIDI Translator","app:Bome Network"]},
  {id="traxx",     label="Stage Traxx",  icon="▶️", x=312, y=244, keys=["app:Stage Traxx"]},
  {id="daw",       label="Ableton Live", icon="🎵", x=520, y=150, keys=["app:Ableton","midi:Ableton Loopback"]},
  {id="out",       label="Audio out",    icon="🔊", x=684, y=150, keys=["audio","audio:probe"]},
]

# Dashboard icons are config data (defaults in riglib/config.py). Override any here —
# keyed by check key or prefix (exact wins, else longest prefix).
# [icons]
# "app:Ableton" = "🎹"
