# rig.toml — copy to `rig.toml` (git-ignored) and set YOUR rig here. Anything omitted
# falls back to the generic defaults in readyset/core/config.py. Nothing below is personal —
# these are placeholder examples; replace with your paths / IPs / device names / MACs.

[set]
ableton_app = "/Applications/Ableton Live 12 Suite.app"
project     = "/path/to/your/Gig Set.als"    # the .als preflight opens
open_after_launch = true

[launch]
apps = [
  "/Applications/Bome MIDI Translator Pro.app",
  "/Applications/Bome Network.app",
  "/Applications/Elgato Stream Deck.app",
  # "/Applications/Stage Traxx 4.app",
  # "/Applications/Amphetamine.app",
]
settle_seconds = 2
amphetamine_session = true   # start an anti-sleep session during bring-up

[server]
# The dashboard's listening interface.
#   "127.0.0.1" (default) → this machine only.
#   "0.0.0.0"             → open to the LOCAL NETWORK: the page can be read from the
#                           phone, and above all the phone can publish its own
#                           state (POST /api/phone, see further down).
# There is NO authentication at all, and the dashboard knows how to launch and quit apps
# (/api/fix, /api/quit-apps, /api/preflight). Only open it on a trusted network.
host = "127.0.0.1"
# Age beyond which the phone's last report is no longer believed (seconds).
# Age beyond which the last reading is no longer believed and the line reverts to
# « à confirmer ». One hour, not five minutes: an iOS automation only publishes on
# PLUGGING IN, so "plugged in 20 min ago" stays true. If the Mac polls by itself
# (idevice_poll_seconds below), come down to just above that cadence: the silence
# then becomes a signal in itself.
phone_stale_seconds = 3600

# --- the battery slope, which serves as a DENIAL -------------------------------------
# "Charging" is a fact dated from the plugging-in, which nothing re-checks any more: a
# cable pulled out, a power strip switched off, a dead charger do not change it. The
# battery does. A single per cent LOST is enough to conclude — a charging battery does
# not go backwards — hence a short minimum span, shorter than a soundcheck.
trend_window_seconds = 10800       # we do not look further back than 3 h
trend_min_span_seconds = 180       # minimum span before speaking of a drop
# ESTIMATING the remaining time takes far more hindsight: to within 1 % over 3 min, the
# slope is worth ±20 %/h. Below that span we say "it is going down" without daring to
# put a figure on how long.
trend_autonomy_span_seconds = 1800
autonomy_min_hours = 3.0           # below that, it will not last the evening → error

# --- two possible sources, a single history ------------------------------------------
# 1) THE PHONE PUBLISHES (nothing to install):
#      curl -X POST http://<mac>.local:8765/api/phone \
#           -H 'Content-Type: application/json' \
#           -d '{"charging": true, "battery": 87}'
#    On the iPhone (French UI labels): Raccourcis → « Niveau de la batterie » +
#    « État de charge » → « Obtenir le contenu de l'URL » (POST, JSON), triggered by a
#    « quand je branche / débranche » automation. Simple, but it is not a heartbeat:
#    the slope needs several points.
# 2) THE MAC POLLS (regular heartbeat, nothing to install on the phone) — via
#    libimobiledevice: `brew install libimobiledevice`, then the iPhone plugged in ONCE
#    over USB, unlocked, « Se fier », and Finder → « Afficher cet iPhone lorsqu'il est
#    en Wi-Fi ». Without pairing, the read fails silently and nothing changes.
idevice_poll_seconds = 60          # 0 = do not poll
idevice_bin = ""                   # empty = PATH, then the Homebrew locations

[checks]
apps = { Ableton = "Ableton Live.*/MacOS/Live", "Stream Deck" = "Elgato Stream Deck.app/Contents/MacOS/Stream Deck", "Bome MIDI Translator" = "MIDITranslatorPro", "Bome Network" = "Bome Network.app/Contents/MacOS/MT Player" }
midi_required = ["Ableton Loopback"]      # MIDI input ports that MUST exist
breath_port   = "Breath Controller"       # breath controller's MIDI input name
audio_interface = "USB Audio"             # your interface's CoreAudio name
default_output_match = "MacBook"          # macOS default output should be the Mac
bome_network_port = 37000                 # Bome Network port; ESTABLISHED = remote connected
iphone_host = ""                          # require a specific peer IP, or empty = any
# Network (your stage + studio):
stage_network = "192.168.1"               # subnet the Mac must be on
modem_host    = "192.168.1.1"             # stage router/modem to ping
studio_router = "192.168.1.1"             # reachable → "auto" mode = studio
lamp_severity = "warn"

# Stream Decks. Short form (product-name substring per deck):
#   streamdecks = { XL = "Stream Deck XL", Plus = "Stream Deck +" }
# Long form (preferred) — matches the USB serial FIRST, product name second, and passes
# if either hits. The name ioreg exposes isn't stable across firmwares (the Plus shows up
# as "Stream Deck +" on some, "Stream Deck Plus" on others) whereas the serial never
# changes. Read it off the Stream Deck app's own device id in any profile manifest:
# "UUID": "@(1)[vid/pid/SERIAL]". The serial below is a made-up example — use yours.
# [[checks.streamdecks]]
# name    = "XL"
# serial  = "AA00A0A00000"
# product = ["Stream Deck XL"]

# Stage lamps (Tuya/WLED) — found by MAC via ARP, then pinged. Add one block per lamp.
# [[checks.lamps]]
# name = "L1"
# mac  = "aa:bb:cc:dd:ee:ff"

# VPN. An active tunnel rewrites the machine's routing, so the Mac can stop seeing the
# iPhone, the stage modem and the lamps — hence a check, and a one-click cut.
[checks.vpn]
# VPNs you accept (substring of the service name) — they never turn the check red.
ignore = []
# Per-VPN override for HOW to cut it (substring → shell command). With no entry, the
# generic method applies: disable the network service — the only thing that holds
# against an on-demand profile (see readyset/vpn.py).
[checks.vpn.off_cmds]

# Open apps the rig doesn't need — one line each, **warning on stage** (a notification
# landing in front of the set, CPU taken from the DAW, an updater waking up mid-song) and
# **plain info in the studio**. Per-mode via `unexpected_apps_severity`; never fail — an
# extra app makes the rig fragile, it doesn't stop it from playing. The dashboard lists
# them with their icons and asks for confirmation before quitting anything; from a
# terminal: `readyset apps`, then `readyset apps --close`.
#
# Only apps with a real on-screen presence are considered: menu-bar agents and background
# apps never show up here — they can't clutter the screen.
[checks.unexpected_apps]
# Never offered for closing (substring of the name or path). Finder is here by default:
# macOS relaunches it anyway.
allow = ["Finder"]

# --- windows: everything RUNS, only the DAW is SEEN ----------------------------------
# The rig apps (MIDI router, deck software, backing-track player) must run — they carry
# the routing, the buttons and the tracks — but their windows are noise on a stage
# screen. Policies: "hide" (⌘H — gone from the screen, still running), "minimize"
# (windows to the Dock), "keep" (left alone).
[windows]
default = "hide"
launch_hidden = true      # `open -g -j`: apps come up already hidden, nothing flashes
after_preflight = true    # a bring-up ends by tidying the screen

[windows.apps]
# Key = substring of the .app name. The DAW stays visible: the set IS the stage screen.
"Ableton" = "keep"

[mode]
default = "auto"    # boots live; flips to studio when studio_router answers

[modes.live]
keyboard_ok   = ["Piano"]             # your main keyboard's MIDI port (green if present)
keyboard_warn = []                    # fallback keyboards (yellow if only these)
live_output   = ["Piano"]            # Ableton must output here on stage
# Anti-sleep: on stage, a Mac that falls asleep stops the set — hence "fail", on the
# same footing as an unplugged keyboard. Levels: fail | warn | info | off ("off" = the
# line does not appear). Replaces the old `require_amphetamine` boolean, which could only
# MAKE THE LINE DISAPPEAR — a rig with no anti-sleep looked like a rig with no problem.
amphetamine_severity = "fail"
breath_severity = "fail"
interface_severity = "fail"
mac_power_severity = "fail"
iphone_power_severity = "fail"
# The soundcheck (gestures actually played) counts as a check in its own right:
# a rig never played is not a rig verified. "off" so as not to require it.
soundcheck_severity = "fail"
network_severity = "fail"   # covers BOTH stage_network and modem_host — same question
# (Mac plugged but battery still draining = always FAIL, both modes.)

[modes.studio]
keyboard_ok   = ["Piano"]
keyboard_warn = ["microKey"]
live_output   = ["MacBook", "USB Audio"]
amphetamine_severity = "off"   # at the desk the Mac may sleep: the question has no object
breath_severity = "warn"
interface_severity = "warn"
mac_power_severity = "warn"
iphone_power_severity = "warn"
network_severity = "warn"   # the stage network is elsewhere — at the desk it *can't*
                            # answer, so its absence is information, not a defect

[monitor]
interval    = 5
audio_every = 6
alerts      = ["macos", "push", "streamdeck"]
recovery_alerts = true

[alerts.push]
# ntfy.sh: pick a PRIVATE, unguessable topic and subscribe to it in the ntfy app.
server   = "https://ntfy.sh"
topic    = ""            # e.g. "my-rig-9d3f2a" — leave empty to disable push
priority = "high"
insecure = false         # set true only if your LAN does SSL interception (self-signed)

[alerts.midi]
# Emits a CC carrying the NUMBER of failing checks on a dead-end IAC port. Create it
# once: Audio MIDI Setup → IAC Driver → "+" → rename "rig-alert". Map a control-surface
# key to MIDI feedback on this CC: show the value, and switch to an alert image when it
# is not zero. A count beats a lamp — 0 is unambiguously "all good", where an unlit lamp
# could equally mean "never lit" or "note-off missed".
port    = "rig-alert"
channel = 15
cc      = 111

# ---------------------------------------------------------------------------------
# KNOCK-ON failures — what goes down WITH what (readyset/core/cascade.py).
#
# Not to be confused with [diagram]: that one draws the MIDI and audio flow, this one
# describes the DEPENDENCIES — most often the power. The two do not overlap:
# a keyboard can send its MIDI to Ableton while drawing its current from a hub, and it
# is the current that decides who falls with whom.
#
# Without these blocks, an unplugged hub produces four equally urgent failures, three of
# which are symptoms; the alarm screen lines them up and leaves you hunting for the one
# to repair. With them, the CAUSE goes to the top and the others file in underneath it,
# greyed out, each saying in one line why it went down.
#
#   on    = the key of the check which, by going down, brings the others with it
#   keys  = the keys that depend on it (they are only "knock-on" if `on` is ALSO down
#           — a device unplugged while its source is fine remains a failure in its own
#           right, and hiding it would be worse than linking nothing at all)
#   why   = the link spelled out; it is what says where to go and look
#   modes = optional — the link only holds in these modes (at the desk, half the rig is
#           simply not plugged in, and a link that does not hold tonight lies)
#
# Chains are walked back up: if A powers B and B powers C, the cause displayed is A.
#
# [[depends]]
# on    = "usb:Plus"
# keys  = ["usb:XL", "kbd:keyboard"]
# why   = "alimenté par le Stream Deck Plus"
# modes = ["live"]
