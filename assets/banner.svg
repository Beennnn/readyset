<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="readyset — a macOS app that brings a live rig up and proves it is ready">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#141a35"/>
      <stop offset="1" stop-color="#1c1030"/>
    </linearGradient>
    <linearGradient id="gM" gradientUnits="userSpaceOnUse" x1="70" y1="100" x2="256" y2="262">
      <stop offset="0" stop-color="#3ddc97"/>
      <stop offset="0.5" stop-color="#2ec4b6"/>
      <stop offset="1" stop-color="#4cc9f0"/>
    </linearGradient>
    <linearGradient id="gR" gradientUnits="userSpaceOnUse" x1="302" y1="0" x2="642" y2="0">
      <stop offset="0" stop-color="#3ddc97"/>
      <stop offset="0.5" stop-color="#2ec4b6"/>
      <stop offset="1" stop-color="#4cc9f0"/>
    </linearGradient>
    <linearGradient id="gB" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1280" y2="0">
      <stop offset="0" stop-color="#3ddc97"/>
      <stop offset="0.5" stop-color="#2ec4b6"/>
      <stop offset="1" stop-color="#4cc9f0"/>
    </linearGradient>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect x="0" y="352" width="1280" height="8" fill="url(#gB)" opacity="0.85"/>

  <!-- what the repository is, said as a shape -->
  <g transform="translate(70,100)" opacity="0.95">
    <g fill="none" stroke="url(#gM)" stroke-width="2.5">
      <rect x="0" y="0"   width="26" height="26" rx="7"/>
      <rect x="0" y="44"  width="26" height="26" rx="7"/>
      <rect x="0" y="88"  width="26" height="26" rx="7"/>
      <rect x="0" y="132" width="26" height="26" rx="7"/>
      <path d="M6 13 l6 6 l10 -13"/>
      <path d="M6 57 l6 6 l10 -13"/>
      <path d="M6 101 l6 6 l10 -13"/>
    </g>
    <g fill="#2a3358">
      <rect x="44" y="7"   width="132" height="11" rx="5.5"/>
      <rect x="44" y="51"  width="108" height="11" rx="5.5"/>
      <rect x="44" y="95"  width="126" height="11" rx="5.5"/>
    </g>
    <rect x="0" y="132" width="26" height="26" rx="7" fill="url(#gM)" filter="url(#glow)"/>
    <rect x="44" y="139" width="90" height="11" rx="5.5" fill="url(#gM)" opacity="0.85"/>  </g>

  <!-- name, one-line subtitle, technical line -->
  <g transform="translate(300,162)">
    <text x="0" y="0" font-family="-apple-system, Segoe UI, sans-serif" font-size="76" font-weight="700" fill="#ffffff" letter-spacing="-0.5">readyset</text>
    <rect x="2" y="20" width="340" height="5" rx="2.5" fill="url(#gR)"/>
    <text x="2" y="72" font-family="-apple-system, Segoe UI, sans-serif" font-size="24" fill="#aab4d8">Brings a live rig up on macOS — then proves it is ready.</text>
    <text x="2" y="110" font-family="Menlo, Consolas, monospace" font-size="17" fill="#7f8bb5">CLI  ·  local web dashboard  ·  menu-bar indicator  ·  all the specifics in rig.toml</text>
  </g>
</svg>
